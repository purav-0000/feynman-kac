# Data options
data_dir: "black_scholes_simulated_data"
uniform_t: True

# Data hyperparameters
N_u: 350000
N_f: 100000

# Model hyperparameters
layers: [2, 32, 32, 32, 32, 32, 32, 1]  # If passed as override, enter as 2,32,32,32,32,32,32,1

# Training hyperparameters
# Loss function weights
w_data: 1.0
w_physics: 1.0
w_sindy: 1000000 # 1e+6
w_l1: 0.00001 # 1e-5

# Optimizer
max_eval: 3_000
max_eval_FT: 3_00
patience: 3

display_every: 100
output_dir: "black-scholes"  # Saves to this directory when training, when testing, loads from this directory

# Execution mode
mode: "train"  # Options: 'train', 'test'
